<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fossil Free RBC — Temporarily unavailable</title>
<meta name="description" content="FossilFreeRBC.org is temporarily unavailable. We're working to restore it as quickly as possible.">
<!-- Placeholder only: keep search engines from replacing the real site's listing with this page. -->
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "AmsiPro-Ultra";
    src: url("/assets/AmsiPro-Ultra.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --black: #101012;
    --white: #ffffff;
    --red: #e50b12;
    --light: #f5f4ed;
    --beige: #e6e5de;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--light);
    color: var(--black);
    font-family: "Roboto", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }
  header, main, footer {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding-left: 24px;
    padding-right: 24px;
  }
  header { padding-top: 32px; }
  .logo { display: inline-block; }
  .logo img { display: block; height: 34px; width: auto; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-top: 64px;
    padding-bottom: 64px;
  }
  .eyebrow {
    font-family: "Readex Pro", sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--red);
    margin: 0 0 16px;
  }
  h1 {
    font-family: "AmsiPro-Ultra", "Readex Pro", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(44px, 9vw, 108px);
    line-height: 0.95;
    letter-spacing: -0.01em;
    margin: 0 0 32px;
    max-width: 12ch;
  }
  .lede {
    font-size: clamp(18px, 2.2vw, 22px);
    max-width: 38em;
    margin: 0 0 40px;
  }
  .button {
    align-self: flex-start;
    display: inline-block;
    background: var(--red);
    color: var(--white);
    font-family: "Readex Pro", sans-serif;
    font-weight: 600;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: var(--radius);
    transition: background 0.15s;
  }
  .button:hover, .button:focus-visible { background: var(--black); }
  footer {
    border-top: 1px solid var(--beige);
    padding-top: 24px;
    padding-bottom: 32px;
    font-size: 14px;
    color: #55555a;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
  <header>
    <a class="logo" href="https://stand.earth/" aria-label="Stand.earth">
      <img src="/assets/stand-logo-red.svg" alt="Stand.earth">
    </a>
  </header>

  <main>
    <p class="eyebrow">Fossil Free RBC</p>
    <h1>Temporarily unavailable</h1>
    <p class="lede">
      FossilFreeRBC.org is temporarily offline. We're working to restore it as quickly
      as possible. Thank you for your patience — please check back soon.
    </p>
    <a class="button" href="https://stand.earth/">Visit Stand.earth</a>
  </main>

  <footer>
    Fossil Free RBC is a campaign of <a href="https://stand.earth/">Stand.earth</a>.
  </footer>
</body>
</html>
